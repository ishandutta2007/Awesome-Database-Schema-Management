<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- CSS Keyframe Animations -->
    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(1deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(1.05); }
      }
      @keyframes flowLine {
        0% { stroke-dashoffset: 100; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes badgeShimmer {
        0%, 100% { opacity: 0.8; }
        50% { opacity: 1; filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.8)); }
      }
      .floating-node { animation: floatSlow 6s ease-in-out infinite; }
      .glowing-orb { animation: pulseGlow 4s ease-in-out infinite; transform-origin: center; }
      .animated-line { stroke-dasharray: 12, 8; animation: flowLine 15s linear infinite; }
      .badge-anim { animation: badgeShimmer 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Base Card Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" stroke="#30363d" stroke-width="2"/>

  <!-- Background Animated Glowing Orbs (Behind content) -->
  <circle cx="150" cy="80" r="140" fill="url(#glow-grad)" class="glowing-orb"/>
  <circle cx="1050" cy="280" r="160" fill="url(#glow-grad)" class="glowing-orb" style="animation-delay: 2s;"/>

  <!-- Grid Tech Lines -->
  <g stroke="#21262d" stroke-width="1" stroke-opacity="0.4">
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="1000" y1="0" x2="1000" y2="360"/>
  </g>

  <!-- Floating Dynamic Schema Connection Nodes (Background layer) -->
  <g stroke="url(#accent-cyan)" stroke-width="1.5" class="animated-line" opacity="0.4">
    <path d="M 80 280 Q 250 320 420 280 T 800 300" fill="none"/>
    <path d="M 900 60 Q 1050 120 1120 200" fill="none"/>
  </g>

  <!-- Decorative Pills & Cards in Background Right side (opacity 0.25 to stay in background) -->
  <g transform="translate(850, 45)" class="floating-node" opacity="0.35">
    <!-- Mini DB Schema Card -->
    <rect x="0" y="0" width="280" height="150" rx="10" fill="#161b22" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="15" y="15" width="120" height="12" rx="4" fill="#38bdf8"/>
    <rect x="15" y="38" width="250" height="1" fill="#30363d"/>
    <rect x="15" y="48" width="90" height="8" rx="3" fill="#818cf8"/>
    <rect x="120" y="48" width="60" height="8" rx="3" fill="#484f58"/>
    <rect x="15" y="65" width="110" height="8" rx="3" fill="#818cf8"/>
    <rect x="140" y="65" width="50" height="8" rx="3" fill="#484f58"/>
    <rect x="15" y="82" width="80" height="8" rx="3" fill="#c084fc"/>
    <rect x="110" y="82" width="70" height="8" rx="3" fill="#484f58"/>
    <rect x="15" y="99" width="100" height="8" rx="3" fill="#38bdf8"/>
    <rect x="130" y="99" width="60" height="8" rx="3" fill="#484f58"/>
  </g>

  <!-- Foreground Title and Content Section -->
  <g filter="url(#shadow)">
    <!-- Main Category Badge -->
    <g transform="translate(60, 45)" class="badge-anim">
      <rect x="0" y="0" width="260" height="32" rx="16" fill="#1f2937" stroke="#38bdf8" stroke-width="1"/>
      <text x="130" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">
        🗄️ DATABASE DEVOPS ECOSYSTEM
      </text>
    </g>

    <!-- Main Title -->
    <text x="60" y="130" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" letter-spacing="-0.5">
      Awesome Database Schema Management
    </text>

    <!-- Gradient Accent Bar below title -->
    <rect x="60" y="148" width="340" height="4" rx="2" fill="url(#accent-cyan)"/>

    <!-- Subtitle -->
    <text x="60" y="192" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400">
      Curated List of Schema Migration, Version Control, Declarative Schema-as-Code &amp; Database CI/CD
    </text>

    <!-- Feature Pills in Foreground -->
    <g transform="translate(60, 235)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="175" height="36" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
        <text x="87" y="23" fill="#e5e7eb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">
          ⚡ Declarative GitOps
        </text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(190, 0)">
        <rect x="0" y="0" width="185" height="36" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
        <text x="92" y="23" fill="#e5e7eb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">
          🔄 Schema Migrations
        </text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(390, 0)">
        <rect x="0" y="0" width="175" height="36" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
        <text x="87" y="23" fill="#e5e7eb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">
          🛡️ Database CI/CD
        </text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(580, 0)">
        <rect x="0" y="0" width="175" height="36" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
        <text x="87" y="23" fill="#e5e7eb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">
          📊 SaaS &amp; Open Source
        </text>
      </g>
    </g>

    <!-- Footer Meta -->
    <text x="60" y="315" fill="#6b7280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">
      Updated October 2026 • Community Curated • Production-Grade Tooling
    </text>
  </g>
</svg>
